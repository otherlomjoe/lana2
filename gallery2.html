<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<title>Lana-Leigh Lombard Gallery (Dynamic)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="scripts/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="scripts/bootstrap/css/bootstrap-responsive.min.css" rel="stylesheet">

<link href="scripts/icons/general/stylesheets/general_foundicons.css" rel="stylesheet">
<link href="scripts/icons/social/stylesheets/social_foundicons.css" rel="stylesheet">
<link rel="stylesheet" href="scripts/fontawesome/css/font-awesome.min.css">

<link rel="stylesheet" type="text/css" href="directionaware/css/style.css" />
<script src="directionaware/js/modernizr.custom.97074.js"></script>
<noscript>
<link rel="stylesheet" type="text/css" href="directionaware/css/noJS.css"/>
</noscript>

<link href="styles/custom.css" rel="stylesheet">
</head>

<body id="pageBody">
<div id="divBoxed" class="container">

  <div class="transparent-bg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;"></div>

  <div class="divPanel notop nobottom">
    <div class="row-fluid">
      <div class="span12">
        <div id="divLogo">
          <a href="index.html" id="divSiteTitle">Lana-Leigh Lombard</a><br />
          <a href="index.html" id="divTagLine">Arty Adventures</a>
        </div>
      </div>
    </div>

    <div class="row-fluid">
      <div class="span12">
        <div class="centered_menu">
          <div class="navbar">
            <button type="button" class="btn btn-navbar-highlight btn-large btn-primary" data-toggle="collapse" data-target=".nav-collapse">
              NAVIGATION <span class="icon-chevron-down icon-white"></span>
            </button>
            <div class="nav-collapse collapse">
              <ul class="nav nav-pills ddmenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li class="active"><a href="gallery2.html">Gallery2 (Dynamic)</a></li>
                <li><a href="contact.html">Contact</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row-fluid">
      <div class="span12">
        <div id="contentInnerSeparator"></div>
      </div>
    </div>
  </div>

  <div class="contentArea">
    <div class="divPanel notop page-content">

      <div class="breadcrumbs">
        <a href="index.html">Home</a> &nbsp;/&nbsp; <span>Gallery (Dynamic)</span>
      </div>

      <!-- Exhibitions -->
      <h1>Solo Exhibitions</h1>
      <ul id="exhibitions" class="da-thumbs"></ul>

      <!-- Gallery -->
      <h1>Gallery Page</h1>
      <ul id="gallery" class="da-thumbs"></ul>
		<div class="clearfix"></div>
      <!-- Pagination -->
      <div class="pagination">
        <ul id="pagination"></ul>
      </div>

      <div id="footerInnerSeparator"></div>
    </div>
  </div>

  <div id="footerOuterSeparator"></div>
  <div id="footer-placeholder"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    // Load footer
    fetch("/footer.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("footer-placeholder").innerHTML = html;
      });

    // Load metadata
    const exhibitions = await fetch("/gallery/exhibitions.json").then(r => r.json());
    const items = await fetch("/gallery/items.json").then(r => r.json());

    // ⭐ Filter disabled items
    const activeItems = items.filter(item => !item.disabled);

    // --- Exhibitions (manual order) ---
    const exList = document.getElementById("exhibitions");
    exhibitions
      .sort((a, b) => a.order - b.order)
      .forEach(ex => {
        const li = document.createElement("li");
        li.innerHTML = `
          <a href="/gallery/exhibition2.html#${ex.slug}">
            <img src="${ex.thumbnail}">
            <div><span>${ex.name}<br>${ex.description}</span></div>
          </a>
        `;
        exList.appendChild(li);
      });

    // --- Gallery items (newest first) ---
    const galleryList = document.getElementById("gallery");
    const pagination = document.getElementById("pagination");

    // ⭐ Sort newest first
    const sorted = activeItems.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));

    const pageSize = 20;
    const pageCount = Math.ceil(sorted.length / pageSize);

    // Determine current page
    const urlParams = new URLSearchParams(window.location.search);
    const currentPage = parseInt(urlParams.get("page") || "1");

    // Render items for current page
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;

    sorted.slice(start, end).forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `
        <a href="/gallery/item2.html#${item.slug}">
          <img src="${item.thumbnail}">
          <div><span>${item.title}<br>${item.medium}</span></div>
        </a>
      `;
      galleryList.appendChild(li);
    });

    // Render pagination
    for (let i = 1; i <= pageCount; i++) {
      const li = document.createElement("li");
      li.innerHTML = `<a href="gallery2.html?page=${i}">${i}</a>`;
      pagination.appendChild(li);
    }

});
</script>


<script src="scripts/jquery.min.js"></script>
<script src="scripts/bootstrap/js/bootstrap.min.js"></script>
<script src="scripts/default.js"></script>

<script src="directionaware/js/jquery.hoverdir.js"></script>
<script>
$(function() {
    $('#exhibitions > li').each(function() { $(this).hoverdir(); });
    $('#gallery > li').each(function() { $(this).hoverdir(); });
});
</script>

</body>
</html>
