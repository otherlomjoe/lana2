<!-- Dynamic loader -->
<script>

//
// ---------------------------------------------------------
// AUTO‑DERIVE HELPERS (match gallery.html)
// ---------------------------------------------------------
//
function fileSlug(slug) {
    return slug.replace(/-/g, "");
}

function getTitle(item) {
    return item.title && item.title.trim() !== ""
        ? item.title
        : item.slug
            .split('-')
            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
}

function getFull(item) {
    return item.full && item.full.trim() !== ""
        ? item.full
        : `/gallery/all/full/${fileSlug(item.slug)}.jpg`;
}

//
// ---------------------------------------------------------
// DESCRIPTION FORMATTER (your existing tiny‑markup parser)
// ---------------------------------------------------------
//
function formatDescription(text) {
    // Paragraphs
    let html = text.split("\n\n")
        .map(p => `<p>${p}</p>`)
        .join("");

    // Bold
    html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    // Italics
    html = html.replace(/\*(.*?)\*/g, "<em>$1</em>");

    // Bullet lists
    html = html.replace(/<p>- (.*?)<\/p>/g, "<ul><li>$1</li></ul>");

    // Single line breaks
    html = html.replace(/\n/g, "<br>");

    return html;
}

//
// ---------------------------------------------------------
// MAIN LOADER
// ---------------------------------------------------------
//
function normalizeUploadedItem(item) {
    if (!item || !item.slug) return null;

    return {
        ...item,
        title: item.title || "",
        medium: item.medium || "",
        genre: item.genre || "",
        description: item.description || "",
        thumbnail: item.thumbnail || item.thumbnail_path || "",
        full: item.full || item.full_path || item.thumbnail || item.thumbnail_path || "",
        dateAdded: item.dateAdded || item.date_added || "",
        disabled: Boolean(item.disabled),
        sold: Boolean(item.sold),
        source: item.source || "server"
    };
}

async function getUploadedGalleryItems() {
    try {
        const response = await fetch("/gallery-api.php?action=list", {
            headers: { Accept: "application/json" },
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Gallery API unavailable");
        }

        const data = await response.json();
        const items = Array.isArray(data) ? data : [];
        const normalized = items.map(normalizeUploadedItem).filter(Boolean);

        try {
            localStorage.setItem("lana_gallery_uploaded_items", JSON.stringify(normalized));
        } catch (error) {
            // Ignore storage issues in browsers that block local storage.
        }

        return normalized;
    } catch (error) {
        try {
            const raw = localStorage.getItem("lana_gallery_uploaded_items");
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed.map(normalizeUploadedItem).filter(Boolean) : [];
        } catch (localError) {
            return [];
        }
    }
}

async function loadArtwork() {
    const slug = window.location.hash.replace("#", "");

    const remoteItems = await fetch("/gallery/works.json").then(r => r.json());
    const uploadedItems = await getUploadedGalleryItems();
    const merged = new Map();
    [...uploadedItems, ...remoteItems].forEach(item => {
        if (item && item.slug) {
            merged.set(item.slug, item);
        }
    });
    const items = Array.from(merged.values());

    const item = items.find(i => i.slug === slug);

    if (!item) {
        document.getElementById("art-title").innerText = "Artwork not found";
        return;
    }

    //
    // TITLE + BREADCRUMB
    //
    const title = getTitle(item);
    document.getElementById("crumb-title").innerText = title;
    document.getElementById("art-title").innerText = title;

    //
    // FULL IMAGE (auto‑derived or overridden)
    //
    const fullImage = getFull(item);

    document.getElementById("art-image").onerror = () => {
        document.getElementById("art-image").src = "/gallery/all/full/fallback.jpg";
    };

    document.getElementById("art-image").src = fullImage;
    document.getElementById("art-image-link").href = fullImage;

    //
    // MEDIUM
    //
    document.getElementById("art-medium").innerText = item.medium || "";

    //
    // DESCRIPTION
    //
    document.getElementById("art-description").innerHTML =
        formatDescription(item.description || "");
	
	//
	// METADATA TAGS (clickable → gallery filters)
	//
	const metaContainer = document.getElementById("item-meta");
	let metaTags = [];

	// Genre
	if (item.genre) {
		const safe = item.genre.toLowerCase().replace(/\s+/g, '-');
		metaTags.push(`<a class="tag" href="/gallery.html#genre-${safe}">Genre: ${item.genre}</a>`);
	}

	// Medium
	if (item.medium) {
		const safe = item.medium.toLowerCase().replace(/\s+/g, '-');
		metaTags.push(`<a class="tag" href="/gallery.html#medium-${safe}">Medium: ${item.medium}</a>`);
	}

	// Date Added
	if (item.dateAdded) {
		metaTags.push(`<a class="tag" href="/gallery.html#date-${item.dateAdded}">Added: ${item.dateAdded}</a>`);
	}

	// Disabled (optional)
	if (item.disabled) {
		metaTags.push(`<a class="tag" href="/gallery.html#disabled-true">Disabled</a>`);
	}

	metaContainer.innerHTML = metaTags.join("");
	
    //
    // PREVIOUS / NEXT NAVIGATION
    // (skip disabled works)
    //
    const enabledItems = items.filter(i => !i.disabled);
    const index = enabledItems.findIndex(i => i.slug === slug);

    const prev = enabledItems[index - 1];
    const next = enabledItems[index + 1];

    if (prev) {
        document.getElementById("prev-link").href = `/gallery/work.html#${prev.slug}`;
        document.getElementById("prev-link").style.display = "";
    } else {
        document.getElementById("prev-link").style.display = "none";
    }

    if (next) {
        document.getElementById("next-link").href = `/gallery/work.html#${next.slug}`;
        document.getElementById("next-link").style.display = "";
    } else {
        document.getElementById("next-link").style.display = "none";
    }
}

//
// ---------------------------------------------------------
// INIT
// ---------------------------------------------------------
//
loadArtwork();
window.addEventListener("hashchange", loadArtwork);

</script>
