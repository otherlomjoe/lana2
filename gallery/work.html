<!-- Dynamic loader -->
<script>

//
// ---------------------------------------------------------
// AUTO‑DERIVE HELPERS (match gallery.html)
// ---------------------------------------------------------
//
function fileSlug(slug) {
    return slug.replace(/-/g, "");
}

function getTitle(item) {
    return item.title && item.title.trim() !== ""
        ? item.title
        : item.slug
            .split('-')
            .map(w => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
}

function getFull(item) {
    return item.full && item.full.trim() !== ""
        ? item.full
        : `/gallery/all/full/${fileSlug(item.slug)}.jpg`;
}

//
// ---------------------------------------------------------
// DESCRIPTION FORMATTER (your existing tiny‑markup parser)
// ---------------------------------------------------------
//
function formatDescription(text) {
  const escaped = (text || "").replace(/[&<>\"']/g, character => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
  })[character]);
  return escaped
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .split(/\n\s*\n/)
    .map(paragraph => {
      const lines = paragraph.split("\n").filter(Boolean);
      if (lines.every(line => /^-\s+/.test(line))) {
        return `<ul>${lines.map(line => `<li>${line.replace(/^-\s+/, "")}</li>`).join("")}</ul>`;
      }
      return `<p>${lines.join("<br>")}</p>`;
    })
    .join("");
}

//
// ---------------------------------------------------------
// MAIN LOADER
// ---------------------------------------------------------
//
function normalizeUploadedItem(item) {
    if (!item || !item.slug) return null;

    return {
        ...item,
        title: item.title || "",
        medium: item.medium || "",
        genre: item.genre || "",
        description: item.description || "",
        awardDescription: item.awardDescription || item.award_description || item.awardDesc || '',
        price: item.price || "",
        dimensions: item.dimensions || "",
        printsAvailable: Boolean(item.printsAvailable || item.prints_available || item.prints),
        thumbnail: item.thumbnail || item.thumbnail_path || "",
        full: item.full || item.full_path || item.thumbnail || item.thumbnail_path || "",
        dateAdded: item.dateAdded || item.date_added || "",
        disabled: Boolean(item.disabled),
        available: item.available !== false && item.available !== 0 && item.available !== "0",
        sold: Boolean(item.sold),
        source: item.source || "server"
    };
}

async function getUploadedGalleryItems() {
    try {
        const response = await fetch("/gallery-api.php?action=list", {
            headers: { Accept: "application/json" },
            credentials: "same-origin"
        });

        if (!response.ok) {
            throw new Error("Gallery API unavailable");
        }

        const data = await response.json();
        const items = Array.isArray(data) ? data : [];
        return items.map(normalizeUploadedItem).filter(Boolean);
    } catch (error) {
        return [];
    }
}

async function loadArtwork() {
    const slug = window.location.hash.replace("#", "");

    const uploadedItems = await getUploadedGalleryItems();
    const items = uploadedItems;

    const item = items.find(i => i.slug === slug);

    if (!item) {
        document.getElementById("art-title").innerText = "Artwork not found";
        return;
    }

    //
    // TITLE + BREADCRUMB
    //
    const title = getTitle(item);
    document.getElementById("crumb-title").innerText = title;
    document.getElementById("art-title").innerText = title;

    //
    // FULL IMAGE (auto‑derived or overridden)
    //
    const fullImage = getFull(item);

    document.getElementById("art-image").onerror = () => {
        document.getElementById("art-image").src = "/gallery/all/full/fallback.jpg";
    };

    document.getElementById("art-image").src = fullImage;
    document.getElementById("art-image-link").href = fullImage;

    //
    // MEDIUM
    //
    document.getElementById("art-medium").innerText = item.medium || "";

    //
    // DESCRIPTION
    //
    document.getElementById("art-description").innerHTML =
        formatDescription(item.description || "");
	
	//
	// METADATA TAGS (clickable → gallery filters)
	//
	const metaContainer = document.getElementById("item-meta");
	let metaTags = [];

	// Genre
	if (item.genre) {
    metaTags.push(`<a class="tag" href="/gallery.html?g=${encodeURIComponent(item.genre)}">Genre: ${item.genre}</a>`);
	}

	// Medium
	if (item.medium) {
    metaTags.push(`<a class="tag" href="/gallery.html?m=${encodeURIComponent(item.medium)}">Medium: ${item.medium}</a>`);
	}

  // Collection
  if (item.collection) {
    metaTags.push(`<a class="tag" href="/gallery.html?c=${encodeURIComponent(item.collection)}">Collection: ${item.collection}</a>`);
  }

  // Date Added (moved to under description on work page)

	// Disabled (optional)
	if (item.disabled) {
    metaTags.push(`<a class="tag" href="/gallery.html?d=1">Disabled</a>`);
	}

  // Available
  if (typeof item.available !== 'undefined') {
    if (item.available) metaTags.push(`<a class="tag" href="/gallery.html?s=available">Original: Available</a>`);
    else metaTags.push(`<a class="tag" href="/gallery.html?s=sold">Original: Sold</a>`);
  }

  // Sold (copiesSold > 0)
  // Original status is shown above, so do not add a second sold badge.

  // Prints available (boolean)
  if (typeof item.printsAvailable !== 'undefined') {
    const printStatus = item.printsAvailable ? 'Available' : 'Sold';
    metaTags.push(`<a class="tag" href="/gallery.html?p=1">Limited Prints: ${printStatus}</a>`);
  }

  // Award (show badge and optional award description)
  if (item.awardTitle) {
    const desc = item.awardDescription || item.award_description || item.awardDesc || '';
    const escapedDesc = (desc || '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    const safeDesc = escapedDesc ? `<span class="award-desc">${escapedDesc}</span>` : '';
    document.getElementById('art-award').innerHTML = `<span class="award-badge">★ ${item.awardTitle}</span>` + safeDesc;
  }

  // Public price / value under description
  try {
    const pv = document.getElementById('art-price-value');
    if (pv) {
        if (item.price && item.price !== '') {
          pv.innerText = `Price: ${item.price}`;
            pv.style.display = '';
        } else {
            pv.innerText = '';
            pv.style.display = 'none';
        }
    }
  } catch (e) { /* ignore */ }

  const dimensions = document.getElementById('art-dimensions');
  if (dimensions) {
    dimensions.innerText = item.dimensions ? `Dimensions: ${item.dimensions}` : '';
    dimensions.style.display = item.dimensions ? '' : 'none';
  }

	metaContainer.innerHTML = metaTags.join("");
	
    //
    // PREVIOUS / NEXT NAVIGATION
    // (skip disabled works)
    //
    const enabledItems = items.filter(i => !i.disabled);
    const index = enabledItems.findIndex(i => i.slug === slug);

    const prev = enabledItems[index - 1];
    const next = enabledItems[index + 1];

    if (prev) {
        document.getElementById("prev-link").href = `/gallery/work.html#${prev.slug}`;
        document.getElementById("prev-link").style.display = "";
    } else {
        document.getElementById("prev-link").style.display = "none";
    }

    if (next) {
        document.getElementById("next-link").href = `/gallery/work.html#${next.slug}`;
        document.getElementById("next-link").style.display = "";
    } else {
        document.getElementById("next-link").style.display = "none";
    }

    // If the viewer is an authenticated admin, fetch full item to show private info
    try {
      const statusRes = await fetch('/gallery-api.php?action=status', { credentials: 'same-origin' });
      if (statusRes.ok) {
        const statusJson = await statusRes.json();
        if (statusJson.authenticated) {
          const itemRes = await fetch('/gallery-api.php?action=item&slug=' + encodeURIComponent(slug), { credentials: 'same-origin' });
          if (itemRes.ok) {
            const body = await itemRes.json();
            if (body && body.success && body.item) {
              const full = body.item;
              const priv = document.getElementById('private-info');
              priv.hidden = false;
              priv.innerHTML = `<strong>Private administration</strong><br>Private price: ${full.pricePrivate || '(none)'}<br>Copies sold: ${full.copiesSold || 0}<br><div class="private-notes">${full.privateNotes ? full.privateNotes : ''}</div>`;
            }
          }
        }
      }
    } catch (e) {
      // ignore silently
    }
}

//
// ---------------------------------------------------------
// INIT
// ---------------------------------------------------------
//
loadArtwork();
window.addEventListener("hashchange", loadArtwork);

</script>

</script>
