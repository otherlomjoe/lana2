<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="../scripts/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="../scripts/bootstrap/css/bootstrap-responsive.min.css" rel="stylesheet">
<link href="../scripts/icons/general/stylesheets/general_foundicons.css" rel="stylesheet">
<link href="../scripts/icons/social/stylesheets/social_foundicons.css" rel="stylesheet">
<link rel="stylesheet" href="../scripts/fontawesome/css/font-awesome.min.css">
<link href="../styles/custom.css" rel="stylesheet">

<!-- HoverDir CSS -->
<link rel="stylesheet" href="directionaware/css/style.css">

<style>
.da-thumbs:after {
    content: "";
    display: block;
    clear: both;
}

.section-heading {
    margin-top: 30px;
    margin-bottom: 10px;
    font-size: 26px;
    font-weight: bold;
}

/* Pagination styling */
#pagination-exhibitions span,
#pagination-works span {
    padding: 6px 12px;
    margin: 4px;
    cursor: pointer;
    background: #ccc;
    color: #333;
    border-radius: 4px;
    font-size: 14px;
}

#pagination-exhibitions span.active,
#pagination-works span.active {
    background: #444;
    color: #fff;
}
</style>

</head>

<body id="pageBody">
<div id="divBoxed" class="container">

  <div class="transparent-bg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;"></div>

  <div class="divPanel notop nobottom">
    <div class="row-fluid">
      <div class="span12">
        <div id="divLogo">
          <a href="../index.html" id="divSiteTitle">Lana-Leigh Lombard</a><br />
          <a href="../index.html" id="divTagLine">Arty Adventures</a>
        </div>
      </div>
    </div>

    <div class="row-fluid">
      <div class="span12">
        <div class="centered_menu">
          <div class="navbar">
            <button type="button" class="btn btn-navbar-highlight btn-large btn-primary" data-toggle="collapse" data-target=".nav-collapse">
              NAVIGATION <span class="icon-chevron-down icon-white"></span>
            </button>
            <div class="nav-collapse collapse">
              <ul class="nav nav-pills ddmenu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../services.html">Services</a></li>
                <li><a href="../gallery.html">Gallery</a></li>
                <li><a href="../contact.html">Contact</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row-fluid">
      <div class="span12">
        <div id="contentInnerSeparator"></div>
      </div>
    </div>
  </div>

  <div class="contentArea">
    <div class="divPanel notop page-content">

      <div class="breadcrumbs">
        <a href="../index.html">Home</a> &nbsp;/&nbsp;
        <a href="../gallery.html">Gallery</a> &nbsp;/&nbsp;
        <span id="page-title"></span>
      </div>

      <!-- Exhibition mode header -->
		<div id="exhibition-header">
			<h2 id="ex-title"></h2>
			<div id="ex-meta"></div>
			<div id="ex-hero"></div>
			<p id="ex-description"></p>
		</div>

      <!-- Exhibitions Section -->
      <h3 class="section-heading" id="exhibitions-heading">Solo Exhibitions and Art Fair Collections</h3>
      <ul id="exhibitions-list" class="da-thumbs"></ul>
      <div id="pagination-exhibitions" style="text-align:center; margin-top:20px;"></div>

      <!-- Works Section -->
      <h3 class="section-heading" id="works-heading">Individual Works</h3>
        
        <!-- Filters Section -->
        <div id="filters" class="filters-container">
            <div class="filter-group">
                <label>Medium:</label>
                <select id="filter-medium">
                    <option value="">All</option>                  
                </select>
            </div>
			
			<div class="filter-group">
                <label>Genre:</label>
                <select id="filter-genre">
                    <option value="">All</option>                  
                </select>
            </div>

            <div class="filter-group">
                <label>Sold:</label>
                <select id="filter-sold">
                    <option value="">All</option>
                    <option value="sold">Sold</option>
                    <option value="available">Available</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Search:</label>
                <input type="text" id="filter-search" placeholder="Search title or medium">
            </div>

            <button id="filter-reset" class="btn">Reset</button>
        </div>
        
      <ul id="works-list" class="da-thumbs"></ul>
      <div id="pagination-works" style="text-align:center; margin-top:20px;"></div>

      <!-- ⭐ FOOTER INNER SEPARATOR -->
      <div id="footerInnerSeparator"></div>

    </div>
  </div>

  <!-- ⭐ FOOTER OUTER SEPARATOR -->
  <div id="footerOuterSeparator"></div>

  <!-- ⭐ FOOTER PLACEHOLDER -->
  <div id="footer-placeholder"></div>

</div>

<script src="../scripts/jquery.min.js"></script>
<script src="directionaware/js/modernizr.custom.97074.js"></script>
<script src="directionaware/js/jquery.hoverdir.js"></script>
<script src="../scripts/gallery.js"></script>


<!-- ⭐ FOOTER LOADER -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  fetch("/footer.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("footer-placeholder").innerHTML = html;
    });
});
</script>

<script src="../scripts/bootstrap/js/bootstrap.min.js"></script>
<script src="../scripts/default.js"></script>

</body>
</html>
