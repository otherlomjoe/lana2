			  <!--Start Contact form -->
			  <form name="enq" id="contact-form" method="post" action="https://formspree.io/f/xzzeojwd" onsubmit="return validation();">
				<fieldset>
				  <!-- Honeypot Field (hidden from users) -->
				  <input type="text" name="_gotcha" style="display:none">

				  <input type="text" name="name" id="name" value=""  class="input-block-level" placeholder="Name" />
				  <input type="email" name="email" id="email" value="" class="input-block-level" placeholder="email" />
				  <textarea rows="11" name="message" id="message" class="input-block-level" placeholder="Comments"></textarea>

					<div id="form-message" style="display: none;"></div>
					 <!-- reCAPTCHA v3 -->
	<!--            <div class="g-recaptcha" data-sitekey="6Lc_YxYrAAAAACYdCUzN6uIWQZ9x7SogC3d38euC"></div> -->

				<button type="submit">Send Message</button>

				</fieldset>
			  </form>
			  <!--End Contact form --> 
			</div>

			<!-- Form Submission Handler -->
		<script>
			document.getElementById('contact-form').addEventListener('submit', function(e) {
				e.preventDefault();
				const form = e.target;
				const messageDiv = document.getElementById('form-message');

				fetch(form.action, {
					method: 'POST',
					body: new FormData(form),
					headers: { 'Accept': 'application/json' }
				})
			  .then(response => {
					if (response.ok) {
						// Show success message
						messageDiv.style.display = 'block';
						messageDiv.innerHTML = '✓ Message sent successfully!';
						messageDiv.style.color = 'green';
						form.reset();

						// Hide after 5 seconds
						setTimeout(() => {
							messageDiv.style.display = 'none';
						}, 5000);
					} else {
						throw new Error('Failed to send');
					}
				})
				.catch(error => {
					messageDiv.style.display = 'block';
					messageDiv.innerHTML = '⚠ Error sending message. Please try again.';
					messageDiv.style.color = 'red';
				});
			});
		</script>
